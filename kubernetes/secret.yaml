
# Secret for ai_telco_release
# WARNING: Replace placeholder values before deploying!
# Consider using external secrets management (Vault, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: ai_telco_release-secrets
  namespace: ai_telco_release
  labels:
    app.kubernetes.io/name: ai_telco_release
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Auth (always enabled) — generate with: openssl rand -hex 32
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  API_KEY: "CHANGE_ME_IN_PRODUCTION"
  # PostgreSQL
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  # Redis
  REDIS_PASSWORD: ""
  LOGFIRE_TOKEN: ""
  SENTRY_DSN: ""

  # LLM API Keys
  ANTHROPIC_API_KEY: ""
  # LangSmith
  LANGCHAIN_API_KEY: ""
